[project]
# name = "targetdb"
name = "ets_target_database"
description = "PFS target database (targetDB) tools"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Masato Onodera", email = "monodera@naoj.org" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "alembic",
  "astropy",
  "loguru",
  "numpy>=2.0",
  "openpyxl",
  "pandas",
  "psycopg2-binary",
  "pyarrow",
  "requests",
  "sqlalchemy",
  # "setuptools",
  "sqlalchemy-utils",
  "tabulate",
  # "wheel",
  'tomli >= 1.1.0 ; python_version < "3.11"',
  "typer",
]
# version = "0.1.0"
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/Subaru-PFS/ets_target_database"
source = "https://github.com/Subaru-PFS/ets_target_database"

[project.scripts]
pfs-targetdb-cli = "targetdb.cli.cli_main:app"

[project.optional-dependencies]
dev = [
  "ipython",
  "pytest",
  "pytest-cov",
  "black",
  "ruff",
  "pre-commit",
  "setuptools-scm>=8.0",
]
doc = ["mkdocs<2", "mkdocs-material[imaging]"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests requiring a PostgreSQL container via Docker",
]

[tool.black]
line-length = 88
# Generated by setuptools-scm and gitignored; see the matching ruff
# extend-exclude below for why it's kept out of linting/formatting.
extend-exclude = "src/targetdb/_version\\.py"

[tool.pdm.scripts]
serve-doc = { shell = "mkdocs serve", help = "Start the dev server for doc preview" }
build-doc = { shell = "mkdocs build", help = "Build documentation" }
gen-requirements = { cmd = [
  "pdm",
  "export",
  "--format",
  "requirements",
  "--without-hashes",
  "--pyproject",
  "--dev",
  "--output",
  "requirements.txt",
  "--verbose",
], help = "Generate requirements.txt" }

[tool.ruff]
# Matches requires-python (">=3.11"). Do not raise this without raising
# requires-python: with UP rules enabled, ruff rewrites code to the target
# version's syntax.
target-version = "py311"
line-length = 88
# Generated by setuptools-scm and gitignored. It exists locally but not in a
# fresh CI checkout, so linting it makes the checked file set environment-
# dependent.
# alembic/ migrations are historical records and are deliberately not
# linted -- excluding it here (not just in the runners' arguments) keeps
# editors and a bare `ruff check .` in agreement with CI.
extend-exclude = ["src/targetdb/_version.py", "alembic"]

[tool.ruff.lint]
# C4 is flake8-comprehensions, unrelated to C901 (mccabe), which stays off.
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
  "E501",  # line too long -- black owns line length
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools_scm]
version_file = "src/targetdb/_version.py"
tag_regex = "^v\\.?(\\d+\\.\\d+\\.\\d+)$"
