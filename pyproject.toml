[project]
# name = "targetdb"
name = "ets_target_database"
description = "PFS target database (targetDB) tools"
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Masato Onodera", email = "monodera@naoj.org" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "alembic",
  "astropy",
  "loguru",
  "numpy>=2.0",
  "openpyxl",
  "pandas",
  # TargetDB subclasses pfs.utils.database.db.DB; tracking master because its
  # database/ module is still actively developed. `uv.lock` pins the resolved
  # commit, so picking up upstream changes needs an explicit
  # `uv lock --upgrade-package pfs-utils` followed by the integration tests.
  "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git@master",
  "psycopg[binary]",
  "pyarrow",
  "requests",
  "sqlalchemy",
  # "setuptools",
  "sqlalchemy-utils",
  "tabulate",
  # "wheel",
  "typer",
]
# version = "0.1.0"
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/Subaru-PFS/ets_target_database"
source = "https://github.com/Subaru-PFS/ets_target_database"

[project.scripts]
pfs-targetdb-cli = "targetdb.cli.cli_main:app"

[project.optional-dependencies]
dev = [
  "ipython",
  "pytest",
  "pytest-cov",
  "black",
  "ruff",
  "pre-commit",
  "setuptools-scm>=8.0",
]
doc = ["mkdocs<2", "mkdocs-material[imaging]"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests requiring a PostgreSQL container via Docker",
]

[tool.black]
line-length = 88
# Generated by setuptools-scm and gitignored; see the matching ruff
# extend-exclude below for why it's kept out of linting/formatting.
# alembic revision scripts are historical records and are deliberately left
# unformatted -- excluded here too so an editor's black extension with
# format-on-save doesn't rewrite them. Only versions/ is excluded: env.py is
# live code and is formatted like the rest of the package.
extend-exclude = "(src/targetdb/_version\\.py|alembic/.*/versions/)"

[tool.pdm.scripts]
serve-doc = { shell = "mkdocs serve", help = "Start the dev server for doc preview" }
build-doc = { shell = "mkdocs build", help = "Build documentation" }

[tool.ruff]
# Matches requires-python (">=3.12"). Do not raise this without raising
# requires-python: with UP rules enabled, ruff rewrites code to the target
# version's syntax.
target-version = "py312"
line-length = 88
# Generated by setuptools-scm and gitignored. It exists locally but not in a
# fresh CI checkout, so linting it makes the checked file set environment-
# dependent.
# alembic revision scripts are historical records and are deliberately not
# linted -- excluding them here (not just in the runners' arguments) keeps
# editors and a bare `ruff check .` in agreement with CI. Only versions/ is
# excluded; the env.py scripts are live code and are linted like the rest of
# the package.
extend-exclude = ["src/targetdb/_version.py", "alembic/*/alembic/versions"]

[tool.ruff.lint]
# C4 is flake8-comprehensions, unrelated to C901 (mccabe), which stays off.
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
  "E501",  # line too long -- black owns line length
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools_scm]
version_file = "src/targetdb/_version.py"
tag_regex = "^v\\.?(\\d+\\.\\d+\\.\\d+)$"
